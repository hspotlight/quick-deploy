<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลิงก์ในไบโอ · Neo-brutalism</title>
<meta name="description" content="เทมเพลตหน้า Link in Bio / โปรไฟล์ dev สไตล์ Neo-brutalism ไฟล์เดียว แก้ชื่อและลิงก์ได้เอง">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' fill='%23FFD23F' stroke='black' stroke-width='8'/></svg>">

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  ✏️  CONFIG — แก้ข้อมูลของคุณตรงนี้ที่เดียวพอ                     ║
  ║  - แก้ข้อความในเครื่องหมาย "..." ได้เลย (อย่าลบเครื่องหมาย " ,)     ║
  ║  - อยากเพิ่มลิงก์: ก๊อปบรรทัด { ... } ในส่วน links แล้วแก้           ║
  ║  - สีที่ใช้ได้: "yellow" "pink" "blue" "green" "orange" "purple"  ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<script>
const CONFIG = {
  name:   "ชื่อของคุณ",                 // ชื่อที่จะโชว์ตัวใหญ่ ๆ
  handle: "@your.handle",              // ชื่อผู้ใช้ / ยูสเซอร์เนม
  role:   "Frontend Developer",        // ตำแหน่ง หรือสิ่งที่คุณทำ
  bio:    "เขียนแนะนำตัวสั้น ๆ ตรงนี้ 1–2 บรรทัด เช่น ชอบทำเว็บ ชอบสอน ชอบกาแฟ ☕",

  // รูปโปรไฟล์: ใส่ลิงก์รูป (https://...) หรือปล่อยว่าง "" เพื่อใช้ emoji ด้านล่างแทน
  avatar: "",
  avatarEmoji: "🧑‍💻",

  status: "ว่างรับงาน ✦ Open to work", // ป้ายสถานะ (ปล่อยว่าง "" ถ้าไม่ใช้)

  skills: ["HTML", "CSS", "JavaScript", "React", "Figma"],

  // ลิงก์ทั้งหมด: icon = emoji อะไรก็ได้, color = สีปุ่ม
  links: [
    { label: "เว็บไซต์ / Portfolio", url: "https://example.com",             icon: "🌐", color: "yellow" },
    { label: "GitHub",               url: "https://github.com/",             icon: "🐙", color: "pink"   },
    { label: "Facebook Page",        url: "https://www.facebook.com/",       icon: "📘", color: "blue"   },
    { label: "YouTube",              url: "https://www.youtube.com/",        icon: "▶️", color: "orange" },
    { label: "ติดต่อทางอีเมล",          url: "mailto:you@example.com",         icon: "✉️", color: "green"  },
  ],

  footer: "ทำด้วย HTML + CSS ไฟล์เดียว ✦ ไม่มีเฟรมเวิร์ก",
};
</script>
<!-- ═══════════════ จบส่วน CONFIG (ด้านล่างไม่ต้องแก้ก็ได้) ═══════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#111;
    --paper:#FFF6E5;
    --yellow:#FFD23F; --pink:#FF7AC6; --blue:#5EB8FF; --green:#7CE38B;
    --orange:#FF9F45; --purple:#B79CFF;
    --accent: var(--yellow);
    --bw:3px;            /* ความหนาเส้นขอบ */
    --sh:6px;            /* ระยะเงา */
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    font-family:"IBM Plex Sans Thai",system-ui,sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(rgba(17,17,17,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(17,17,17,.07) 1px,transparent 1px);
    background-size:28px 28px;
    display:flex;flex-direction:column;align-items:center;
    padding:48px 18px 40px;
    overflow-x:hidden;
  }
  h1,h2,.btn,.chip,.badge,.sticker{font-family:"Kanit",sans-serif}

  /* ---------- กล่องหลัก ---------- */
  .wrap{width:100%;max-width:520px;position:relative}
  .card{
    background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--radius);
    box-shadow:var(--sh) var(--sh) 0 var(--ink);
    padding:28px 24px 26px;position:relative;
  }
  .card-top{
    position:absolute;inset:0 0 auto 0;height:86px;
    background:var(--accent);border-bottom:var(--bw) solid var(--ink);
    border-radius:calc(var(--radius) - 3px) calc(var(--radius) - 3px) 0 0;
    background-image:radial-gradient(var(--ink) 1.4px,transparent 1.6px);
    background-size:14px 14px;
    transition:background-color .3s;
  }
  .window-dots{position:absolute;top:12px;left:14px;display:flex;gap:7px;z-index:1}
  .window-dots i{width:13px;height:13px;border:2.5px solid var(--ink);border-radius:50%;background:#fff}
  .window-dots i:nth-child(1){background:var(--pink)}
  .window-dots i:nth-child(2){background:var(--yellow)}
  .window-dots i:nth-child(3){background:var(--green)}

  .avatar{
    position:relative;z-index:1;width:116px;height:116px;margin:18px auto 0;
    border:var(--bw) solid var(--ink);border-radius:50%;background:var(--purple);
    box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;
    font-size:58px;overflow:hidden;cursor:pointer;user-select:none;
    transition:transform .15s ease;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar:hover{transform:rotate(-6deg) scale(1.04)}
  .avatar.spin{animation:spin .6s cubic-bezier(.3,1.6,.5,1)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .head{text-align:center;margin-top:16px}
  h1{font-size:clamp(30px,7vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.5px}
  .handle{font-weight:600;margin-top:2px;opacity:.75}
  .role{
    display:inline-block;margin-top:10px;font-family:"Kanit",sans-serif;font-weight:700;
    background:var(--ink);color:#fff;padding:3px 12px;border-radius:6px;transform:rotate(-1.5deg);
  }
  .bio{margin:14px auto 0;max-width:400px;line-height:1.65;font-size:16px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    border:2.5px solid var(--ink);border-radius:99px;padding:4px 14px 4px 10px;
    background:var(--green);font-weight:500;font-size:14px;box-shadow:3px 3px 0 var(--ink);
  }
  .badge .dot{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .chip{
    border:2.5px solid var(--ink);border-radius:8px;padding:3px 11px;font-weight:500;font-size:14px;
    background:#fff;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .12s;
    cursor:default;
  }
  .chip:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--yellow)}

  /* ---------- ปุ่มลิงก์ ---------- */
  .links{display:flex;flex-direction:column;gap:16px;margin-top:26px}
  .btn{
    --c:var(--yellow);
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:var(--c);border:var(--bw) solid var(--ink);border-radius:12px;
    padding:14px 16px;font-size:18px;font-weight:700;
    box-shadow:var(--sh) var(--sh) 0 var(--ink);
    transition:transform .12s ease,box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
    opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;
  }
  .btn .ic{
    width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:21px;
    background:#fff;border:2.5px solid var(--ink);border-radius:9px;
  }
  .btn .lb{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
  .btn .ar{font-size:22px;transition:transform .15s}
  .btn:hover{transform:translate(-3px,-3px);box-shadow:calc(var(--sh) + 3px) calc(var(--sh) + 3px) 0 var(--ink)}
  .btn:hover .ar{transform:translateX(4px) rotate(-45deg)}
  .btn:active{transform:translate(var(--sh),var(--sh));box-shadow:0 0 0 var(--ink);transition-duration:.05s}
  .btn:focus-visible,.tool:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

  /* ---------- แถบเครื่องมือ ---------- */
  .tools{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .tool{
    font-family:"Kanit",sans-serif;font-weight:500;font-size:15px;cursor:pointer;color:var(--ink);
    background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:8px 14px;
    box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  }
  .tool:hover{background:var(--accent)}
  .tool:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}

  footer{margin-top:28px;font-size:13px;text-align:center;font-weight:500;opacity:.7}

  /* ---------- สติกเกอร์ตกแต่ง ---------- */
  .sticker{
    position:absolute;z-index:2;border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink);
    font-weight:800;pointer-events:none;
  }
  .s1{top:-26px;right:-18px;background:var(--pink);padding:6px 14px;border-radius:10px;transform:rotate(8deg);font-size:18px}
  .s2{bottom:120px;left:-44px;width:64px;height:64px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:28px;animation:float 3s ease-in-out infinite}
  .s3{top:36%;right:-54px;background:var(--blue);padding:8px 10px;border-radius:8px;transform:rotate(-10deg);font-size:15px;animation:float 3.6s ease-in-out infinite reverse}
  @keyframes float{50%{translate:0 -10px}}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);
    background:var(--ink);color:#fff;font-family:"Kanit",sans-serif;font-weight:500;
    padding:10px 18px;border-radius:10px;border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--accent);z-index:9;opacity:0;visibility:hidden;
    transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s,visibility .3s;
  }
  .toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

  @media (max-width:640px){
    body{padding:36px 14px 32px}
    .s2,.s3{display:none}
    .s1{right:-6px;top:-22px;font-size:16px}
    .card{padding:24px 18px 22px}
    .btn{font-size:17px;padding:12px 14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .btn{opacity:1}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="sticker s1">HELLO!</div>
    <div class="sticker s2">★</div>
    <div class="sticker s3">&lt;/dev&gt;</div>

    <section class="card">
      <div class="card-top"></div>
      <div class="window-dots"><i></i><i></i><i></i></div>

      <div class="avatar" id="avatar" title="คลิกเล่นได้!"></div>

      <div class="head">
        <h1 id="name"></h1>
        <div class="handle" id="handle"></div>
        <div class="role" id="role"></div>
        <p class="bio" id="bio"></p>
        <div id="statusWrap"></div>
      </div>

      <div class="chips" id="chips"></div>
      <nav class="links" id="links" aria-label="ลิงก์ของฉัน"></nav>

      <div class="tools">
        <button class="tool" id="copyBtn" type="button">📋 คัดลอกลิงก์หน้านี้</button>
        <button class="tool" id="colorBtn" type="button">🎨 เปลี่ยนสี</button>
      </div>
    </section>

    <footer id="footer"></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const COLORS = ["yellow","pink","blue","green","orange","purple"];
  const colorVar = (c) => "var(--" + (COLORS.includes(c) ? c : "yellow") + ")";

  // ข้อมูลพื้นฐาน
  $("name").textContent = CONFIG.name;
  $("handle").textContent = CONFIG.handle;
  $("role").textContent = CONFIG.role;
  $("bio").textContent = CONFIG.bio;
  $("footer").textContent = CONFIG.footer;
  document.title = CONFIG.name + " · ลิงก์ทั้งหมด";
  if (!CONFIG.role) $("role").remove();

  // รูปโปรไฟล์
  const av = $("avatar");
  const useEmoji = () => { av.textContent = CONFIG.avatarEmoji || "🙂"; };
  if (CONFIG.avatar) {
    const img = new Image();
    img.alt = CONFIG.name;
    img.onerror = useEmoji;
    img.src = CONFIG.avatar;
    av.appendChild(img);
  } else useEmoji();
  av.addEventListener("click", () => {
    av.classList.remove("spin"); void av.offsetWidth; av.classList.add("spin");
  });

  // สถานะ
  if (CONFIG.status) {
    const b = document.createElement("span");
    b.className = "badge";
    b.innerHTML = '<span class="dot"></span>';
    b.append(CONFIG.status);
    $("statusWrap").appendChild(b);
  }

  // สกิล
  (CONFIG.skills || []).forEach((s) => {
    const c = document.createElement("span");
    c.className = "chip"; c.textContent = s;
    $("chips").appendChild(c);
  });

  // ลิงก์
  (CONFIG.links || []).forEach((l, i) => {
    const a = document.createElement("a");
    a.className = "btn";
    a.href = l.url;
    if (/^https?:/i.test(l.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.style.setProperty("--c", colorVar(l.color));
    a.style.animationDelay = (0.08 * i + 0.1) + "s";
    const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = l.icon || "🔗";
    const lb = document.createElement("span"); lb.className = "lb"; lb.textContent = l.label;
    const ar = document.createElement("span"); ar.className = "ar"; ar.textContent = "→"; ar.setAttribute("aria-hidden","true");
    a.append(ic, lb, ar);
    $("links").appendChild(a);
  });

  // toast
  let t;
  const toast = (msg) => {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 1800);
  };

  // คัดลอกลิงก์
  $("copyBtn").addEventListener("click", () => {
    const url = location.href;
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("คัดลอกแล้ว ✓"); } catch (e) { toast("คัดลอกไม่ได้ ลองกดค้างที่ลิงก์"); }
      ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(() => toast("คัดลอกแล้ว ✓")).catch(fallback);
    } else fallback();
  });

  // เปลี่ยนสีธีม
  let ci = 0;
  $("colorBtn").addEventListener("click", () => {
    ci = (ci + 1) % COLORS.length;
    document.documentElement.style.setProperty("--accent", "var(--" + COLORS[ci] + ")");
    toast("ธีมสี: " + COLORS[ci]);
  });
})();
</script>
</body>
</html>
